plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mky' // 지정한 그룹 이름
version = '0.0.1-SNAPSHOT'
description = 'springboot-mky'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25) // 지정한 JDK 버전
	}
}

// 의존성을 받을 저장소를 지정
// 여기서 저장소(Repository)는 라이브러리나 의존성 파일을 보관하고 있는 원격 서버
repositories {
	mavenCentral() //Java 생태계에서 사용하는 대표적인 공개 라이브러리 저장소
}

// 프로젝트에서 필요한 기능의 의존성을 입력
dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// 스프링 데이터 JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.h2database:h2' // 인메모리 데이터베이스
	compileOnly 'org.projectlombok:lombok' // 롬복
	annotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
